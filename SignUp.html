<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignUp.css">
    <title>Document</title>
</head>
<body>
    <div class="signupform">
    <h1>Create Account</h1>
      
    <form action="">
    <label for="firstname">First name</label>
    <input type="text" id="firstname" placeholder="Enter Your Fullname" required>

    <label for="lastname">Last name</label>
    <input type="text" id="lastname" placeholder="Enter Your Fullname" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter Your Fullname" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Your Fullname" required>

    <label for="confirmpassword">Confirm Password</label>
    <input type="password" id="confirmpassword" placeholder="Enter Your Fullname" required>
    
    <button type="submit">SignUp</button>
    </form>
      <p>Already have an Account? 
        <a href="#">Login</a>
      </p>
    </div>
    
</body>
</html>
